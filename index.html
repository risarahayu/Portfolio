<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risa Rahayu</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="app.css">
</head>

<body>
  <!-- =========================
       HERO
  ========================== -->
  <main>
    <section class="hero-section">
      <div class="container d-flex flex-column ">
        <div class="row g-4">
          <!-- =========================
               LEFT CONTENT
          ========================== -->
          <div class="col-lg-8 d-flex flex-column gap-3">
            <!-- TITLE -->
            <h1 class="hero-title">
              Risa Rahayu
            </h1>
            <!-- DESCRIPTION -->
            <p class="hero-description">
              Digital & Creative Professional with <strong>nearly 5 years of
                experience</strong> in the digital industry, working across UI/UX
              design, web development, graphic design, and digital
              marketing.
            </p>
            <!-- =========================
                 SKILL CARDS
            ========================== -->

            <div class="row g-3" id="skillCardsContainer">
            </div>
          </div>
          <!-- =========================
               RIGHT PROFILE
          ========================== -->

          <div class="col-lg-4">
            <div class="profile-column">
              <!-- BACKGROUND GLOW -->
              <div class="profile-glow"></div>
              <!-- DESIGN BADGE -->
              <div class="floating-badge badge-designing">
                <img src="image/badge/designing.svg" alt="" height="40">
              </div>
              <!-- CODING BADGE -->
              <div class="floating-badge badge-coding">
                <img src="image/badge/coding.svg" alt="" height="40">
              </div>
              <!-- MARKETING BADGE -->
              <div class="floating-badge badge-marketing">
                <img src="image/badge/marketing.svg" alt="" height="40">
              </div>
              <!-- PROFILE IMAGE -->
              <img src="image/Risa Rahayu Main Image.png" alt="Risa Rahayu" class="profile-image">
            </div>
          </div>
        </div>
        <div class="experience-bar">
          <div class="row align-items-center align-items-stretch ">
            <!-- TITLE -->
            <div class="col-lg-2 border-end align-content-center px-5">
              <div class="experience-title">
                Work Experience
              </div>
            </div>
            <!-- EXPERIENCE 1 -->
            <div class="col-10 px-5">
              <div class="d-flex justify-content-between" id="experienceContainer">
              </div>
            </div>
          </div>
        </div>
    </section>
    <!-- =========================
         WORK EXPERIENCE
    ========================== -->

    <section class="experience-section">

    </section>


  </main>


  <!-- Bootstrap JS -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="app.js"></script>

</body>

</html>
